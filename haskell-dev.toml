# What sets haskoin-store apart for haskell-dev, the development loop of
# https://github.com/jprupp/tools: `haskell-dev build`, `test` and `docs`.

# The spec modules that take most of the time of the tests. Each of their
# groups is run apart, so that the test processes share them evenly.
#
# Haskoin.Store.Integration: each group is an environment of its own, a pod
# of podman-test with a regtest node and a Redis, reached through Unix
# sockets of the pod, and a store, so the groups run at the same time.
slow-specs = [
  "Haskoin.Store.Integration",
  # each download test is a group with a pod of its own
  "Haskoin.Store.Download",
]
