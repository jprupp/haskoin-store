# Telegraf as it comes, for what matters to the dashboard: the statsd input
# with its default settings, written to InfluxDB every ten seconds.
[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "store-1"

[[inputs.statsd]]
  protocol = "udp"
  service_address = ":8125"

[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
  database = "telegraf"
