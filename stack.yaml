resolver: nightly-2026-11-07
ghc-options:
  "$everything": -O2
  # Specialise the polymorphic message loops to their concrete monads. The
  # loops already use loopForever, which stays flat in any monad; this keeps
  # any loop that still goes through a dictionary from leaking too.
  haskoin-store: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-store-data: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-node: -fspecialise-aggressively -fexpose-all-unfoldings
  nqe: -fspecialise-aggressively -fexpose-all-unfoldings
nix:
  packages:
  - perl
  - rocksdb
  - secp256k1
  - zlib
  - pkg-config
  - cacert
packages:
  - .
extra-deps:
  - base16-2.0
  - hashtables-1.4.2
  - statsd-rupp-0.6.0
  - secp256k1-haskell-3.0.0
  - rocksdb-haskell-jprupp-2.8.0
  - rocksdb-query-0.7.0
  - nqe-0.7.0
  - haskoin-core-2.0.0
  - haskoin-node-2.6.0
  - haskoin-store-data-3.0.0
  # Warp keeps the timeout of each connection in time-manager. From 0.3 to
  # 0.3.2, the version in the snapshot, every pause, resume and tickle edits
  # GHC's one timer queue, and Warp does a pause and a resume around every
  # fragment of a streaming answer: under load the edits queue up behind each
  # other, and a simple request waited some 40 ms. 0.4 and later renew a
  # timeout at most every quarter of it and pause without the queue; http2
  # takes it below 0.5.
  - time-manager-0.4.2
