resolver: nightly-2026-11-07
ghc-options:
  "$everything": -O2
  # Specialise the polymorphic message loops to their concrete monads. The
  # loops already use loopForever, which stays flat in any monad; this keeps
  # any loop that still goes through a dictionary from leaking too.
  haskoin-store: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-store-data: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-node: -fspecialise-aggressively -fexpose-all-unfoldings
  nqe: -fspecialise-aggressively -fexpose-all-unfoldings
nix:
  packages:
  - perl
  - rocksdb
  - secp256k1
  - zlib
  - pkg-config
  - cacert
packages:
  - .
extra-deps:
  - base16-2.0
  - hashtables-1.4.2
  - statsd-rupp-0.5.0.2
  - secp256k1-haskell-2.0.1
  - rocksdb-haskell-jprupp-2.7.1
  - rocksdb-query-0.6.1
  - nqe-0.6.9
  - haskoin-core-1.6.1
  - haskoin-node-2.5.1
  - haskoin-store-data-2.0.0
