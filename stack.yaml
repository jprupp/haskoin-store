resolver: nightly-2026-10-28
ghc-options:
  "$everything": -O2
  # Specialise the polymorphic message loops to their concrete monads. The
  # loops already use loopForever, which stays flat in any monad; this keeps
  # any loop that still goes through a dictionary from leaking too.
  haskoin-store: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-store-data: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-node: -fspecialise-aggressively -fexpose-all-unfoldings
  nqe: -fspecialise-aggressively -fexpose-all-unfoldings
nix:
  packages:
  - perl
  - rocksdb
  - secp256k1
  - zlib
  - pkg-config
  - cacert
packages:
  - store
  - data
extra-deps:
  - base16-2.0
  - hashtables-1.4.2
  - statsd-rupp-0.5.0.0
  - git: https://github.com/jprupp/secp256k1-haskell.git
    commit: 29e7ca97790254a4f1b4608733fd92473ff0bf27
  # rocksdb-haskell-jprupp 2.5.0 (memory properties, max_total_wal_size),
  # jprupp/rocksdb-haskell#15, not on Hackage yet
  - git: https://github.com/jprupp/rocksdb-haskell.git
    commit: 78fbadeb4d740936a4c89a7f44b806636689b10d
  - rocksdb-query-0.6.0
  - nqe-0.6.7
  - haskoin-node-2.1.0
  - haskoin-core-1.5.0
