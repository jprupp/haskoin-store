resolver: nightly-2026-10-28
ghc-options:
  "$everything": -O2
  # The message loops are polymorphic in their monad and run at LoggingT IO.
  # Unless GHC specialises them, forever goes through LoggingT's default (*>)
  # and retains a stack frame and two thunks per message.
  haskoin-store: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-store-data: -fspecialise-aggressively -fexpose-all-unfoldings
  haskoin-node: -fspecialise-aggressively -fexpose-all-unfoldings
  nqe: -fspecialise-aggressively -fexpose-all-unfoldings
nix:
  packages:
  - perl
  - rocksdb
  - secp256k1
  - zlib
  - pkg-config
  - cacert
packages:
  - store
  - data
extra-deps:
  - base16-2.0
  - hashtables-1.4.2
  - statsd-rupp-0.5.0.0
  - secp256k1-haskell-1.7.0
  - rocksdb-haskell-jprupp-2.3.0
  - rocksdb-query-0.6.0
  - nqe-0.6.7
  - haskoin-node-2.0.0
  - haskoin-core-1.4.0
