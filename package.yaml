name: haskoin-store
version: 2.0.0
synopsis: Storage and index for Bitcoin and Bitcoin Cash
description: |
  An indexer for Bitcoin and Bitcoin Cash. It downloads blocks and mempool
  transactions from the peer-to-peer network, indexes the chain in RocksDB and
  the mempool in Redis, and serves a REST API with balances, transactions and
  unspent outputs of addresses and extended public keys, a Blockchain.info
  compatible API, and events over WebSockets. Redis also holds the balances of
  extended public keys, and lets several stores answer as one. See the README
  for installation and configuration.
category: Bitcoin, Finance, Network
author: JP Rupp
maintainer: jprupp@protonmail.ch
copyright: (c) Haskoin Developers
license: MIT
license-file: LICENSE
github: jprupp/haskoin-store
homepage: https://github.com/jprupp/haskoin-store#readme
bug-reports: https://github.com/jprupp/haskoin-store/issues
tested-with: GHC == 9.12.4
extra-source-files:
  - cbits/haskoin_store_merge.h
  - src/Haskoin/Store/Fleet/lua/*.lua
  - src/Haskoin/Store/XPub/lua/*.lua
  - swagger.yaml
extra-doc-files:
  - README.md
  - CHANGELOG.md
language: GHC2024
# used by every module: records with fields of the same name, read with a dot
default-extensions:
  - DuplicateRecordFields
  - NoFieldSelectors
  - OverloadedRecordDot
  - OverloadedStrings
dependencies:
  - aeson ^>= 2.2.5.1
  - async ^>= 2.2.6
  - base ^>= 4.21.2.0
  - base16 ^>= 2.0
  - bytes ^>= 0.17.5
  - bytestring ^>= 0.12.2.0
  - cereal ^>= 0.5.8.3
  - conduit ^>= 1.3.6.1
  - containers ^>= 0.7
  - data-default ^>= 0.8.0.2
  - deepseq ^>= 1.5.1.0
  - directory ^>= 1.3.10.1
  - file-embed ^>= 0.0.16.0
  - hashable ^>= 1.5.1.0
  - hashtables ^>= 1.4.2
  - haskoin-store-data ^>= 4.0.0
  - monad-control ^>= 1.0.3.1
  - mtl ^>= 2.3.2
  - haskoin-core ^>= 3.0.0
  - haskoin-node ^>= 2.7.0
  - nqe ^>= 0.7.0
  - random ^>= 1.3.1
  - string-conversions ^>= 0.4.0.1
  - text ^>= 2.1.4
  - time ^>= 1.14
  - transformers ^>= 0.6.3.0
  - unordered-containers ^>= 0.2.21
  - hedis ^>= 0.16.4
  - http-types ^>= 0.12.6
  - network ^>= 3.2.12.0
  - unix ^>= 2.8.8.0
  - rocksdb-haskell-jprupp ^>= 2.8.0
  - rocksdb-query ^>= 0.7.0
  - case-insensitive ^>= 1.2.1.0
  - statsd-rupp ^>= 0.6.0
  - stm ^>= 2.5.3.1
  - vault ^>= 0.3.2.0
  - wai ^>= 3.2.5
  - wai-extra ^>= 3.1.18
  - wai-websockets ^>= 3.0.1.2
  - warp ^>= 3.4.17
  # not imported: a bound on the time-manager that Warp uses. Before 0.4,
  # every fragment of a streaming answer edits GHC's one timer queue, and
  # under load requests queue up behind each other there (stack.yaml)
  - time-manager >= 0.4.2 && < 0.5
  - warp-tls ^>= 3.4.14
  - websockets ^>= 0.13.0.0
  - http-client ^>= 0.7.19
  - wreq ^>= 0.5.4.5
  - lens ^>= 5.3.6
# hpack writes these on one line of haskoin-store.cabal, which is generated
# and so may have lines of 120 columns or more.
ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
library:
  source-dirs: src
  # the merge operators of the database, which RocksDB calls from its own
  # threads: see cbits/haskoin_store_merge.h; and the bell of the probes of
  # the scheduler's delay (Haskoin.Store.Web.Congestion)
  c-sources:
    - cbits/haskoin_store_merge.c
    - cbits/haskoin_store_probe.c
  include-dirs: cbits
  cc-options: -Wall
internal-libraries:
  # Regtest nodes and Valkey in Podman containers, for the integration tests,
  # and temporary directories, for every test and the benchmark.
  integration:
    source-dirs: integration
    dependencies:
      - haskoin-store
      - http-client
      - podman-test ^>= 0.1.0
      - directory ^>= 1.3.10.1
      - process ^>= 1.6.26.1
      - temporary ^>= 1.3
executables:
  haskoin-store:
    main: Main.hs
    source-dirs: app
    # --disable-delayed-os-memory-return: give memory that the heap no longer
    # needs back to the system at once (MADV_DONTNEED), rather than marking it
    # free for the kernel to take when it runs short (MADV_FREE), which keeps
    # it counted as resident. With the default, the heap of a busy store looked
    # like it grew without end under load, from 45 to 260 MiB in six
    # minutes with 10 MiB live, most of it given back already; with the flag
    # it stayed between 50 and 90 MiB, and memory figures mean what they say.
    # -T: keep the statistics of the garbage collector, for the rts.* metrics
    # of StatsD (Haskoin.Store.Runtime); it costs a few counters per collection.
    # -A64m: 64 MiB of new objects for each core between collections, where
    # GHC's default is 4. Every collection stops every thread, and a busy
    # store made 50 to 110 of them a second: with this, 2 to 4, which halved
    # the time that it spent stopped and let a testnet store answer 19% more
    # requests (README, Memory). The price is 60 MiB more memory for each core.
    # The collector itself is GHC's default, which is not chosen here: the
    # non-moving one of 1.15.1 gained nothing in the same measurements.
    ghc-options:
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-N -T -A64m --disable-delayed-os-memory-return"'
    dependencies:
      - haskoin-store
      - directory ^>= 1.3.10.1
      - filepath ^>= 1.5.5.0
      - optparse-applicative ^>= 0.19.0.0
      - unix ^>= 2.8.8.0
tests:
  spec:
    main: Spec.hs
    source-dirs: test
    verbatim:
      build-tool-depends:
        hspec-discover:hspec-discover
    ghc-options:
      - -threaded
      - -rtsopts
      # -T lets the memory test read the heap size; -M4g makes a runaway
      # test fail with heap overflow instead of exhausting the machine
      - '"-with-rtsopts=-N4 -T -M4g"'
    dependencies:
      - haskoin-store
      - hspec ^>= 2.11.18
      - QuickCheck ^>= 2.17.1.0
      - base64 ^>= 1.0.1
      - directory ^>= 1.3.10.1
      - fast-logger ^>= 3.2.9
      - filepath ^>= 1.5.5.0
      - integration
      - podman-test
      - process ^>= 1.6.26.1
benchmarks:
  # Load-test server: syncs a synthetic chain and serves the web API on it.
  # Build with `stack build --bench --no-run-benchmarks` and run it with
  # scripts/bench-web.sh.
  haskoin-store-bench:
    main: Main.hs
    source-dirs: bench
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - haskoin-store
      - directory ^>= 1.3.10.1
      - filepath ^>= 1.5.5.0
      - integration
      - vector ^>= 0.13.2.0
