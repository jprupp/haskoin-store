name: haskoin-store
version: 1.8.1
synopsis: Storage and index for Bitcoin and Bitcoin Cash
description: |
  An indexer for Bitcoin and Bitcoin Cash. It downloads blocks and mempool
  transactions from the peer-to-peer network, indexes them in RocksDB, and
  serves a REST API with balances, transactions and unspent outputs of
  addresses and extended public keys, a Blockchain.info compatible API, and
  events over WebSockets. An optional Redis cache, shared by several stores,
  keeps large wallets fast. See the README for installation and
  configuration.
category: Bitcoin, Finance, Network
author: JP Rupp
maintainer: jprupp@protonmail.ch
copyright: (c) Haskoin Developers
license: MIT
license-file: LICENSE
github: jprupp/haskoin-store
homepage: https://github.com/jprupp/haskoin-store#readme
bug-reports: https://github.com/jprupp/haskoin-store/issues
tested-with: GHC == 9.12.4
extra-source-files:
  - src/Haskoin/Store/Cache/lua/*.lua
  - src/Haskoin/Store/Fleet/lua/*.lua
  - stress/wrk.lua
extra-doc-files:
  - README.md
  - CHANGELOG.md
language: GHC2024
# used by every module: records with fields of the same name, read with a dot
default-extensions:
  - DuplicateRecordFields
  - NoFieldSelectors
  - OverloadedRecordDot
  - OverloadedStrings
dependencies:
  - aeson ^>= 2.2.5.1
  - aeson-pretty ^>= 0.8.11
  - base ^>= 4.21.2.0
  - base16 ^>= 2.0
  - bytes ^>= 0.17.5
  - bytestring ^>= 0.12.2.0
  - cereal ^>= 0.5.8.3
  - conduit ^>= 1.3.6.1
  - containers ^>= 0.7
  - data-default ^>= 0.8.0.2
  - deepseq ^>= 1.5.1.0
  - file-embed ^>= 0.0.16.0
  - hashable ^>= 1.5.1.0
  - hashtables ^>= 1.4.2
  - haskoin-store-data ^>= 1.9
  - monad-control ^>= 1.0.3.1
  - mtl ^>= 2.3.2
  - haskoin-core ^>= 1.6.1
  - haskoin-node ^>= 2.5
  - nqe ^>= 0.6.9
  - random ^>= 1.3.1
  - string-conversions ^>= 0.4.0.1
  - text ^>= 2.1.4
  - time ^>= 1.14
  - transformers ^>= 0.6.3.0
  - unliftio ^>= 0.2.25.1
  - unordered-containers ^>= 0.2.21
  - hedis ^>= 0.16.4
  - http-types ^>= 0.12.6
  - network ^>= 3.2.12.0
  - rocksdb-haskell-jprupp ^>= 2.7.1
  - rocksdb-query ^>= 0.6.1
  - case-insensitive ^>= 1.2.1.0
  - statsd-rupp ^>= 0.5.0.2
  - stm ^>= 2.5.3.1
  - vault ^>= 0.3.2.0
  - wai ^>= 3.2.5
  - wai-websockets ^>= 3.0.1.2
  - warp ^>= 3.4.17
  - websockets ^>= 0.13.0.0
  - wreq ^>= 0.5.4.5
  - lens ^>= 5.3.6
# hpack writes these on one line of haskoin-store.cabal, which is generated
# and so may have lines of 120 columns or more.
ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
library:
  source-dirs: src
internal-libraries:
  # Regtest nodes and Valkey in Podman containers, for the integration tests
  # and the stress test of the cache.
  integration:
    source-dirs: integration
    dependencies:
      - process ^>= 1.6.26.1
executables:
  haskoin-store:
    main: Main.hs
    source-dirs: app
    # --disable-delayed-os-memory-return: give memory that the heap no longer
    # needs back to the system at once (MADV_DONTNEED), rather than marking it
    # free for the kernel to take when it runs short (MADV_FREE), which keeps
    # it counted as resident. With the default, the heap of a busy store looked
    # like it grew without end in the stress test, from 45 to 260 MiB in six
    # minutes with 10 MiB live, most of it given back already; with the flag
    # it stayed between 50 and 90 MiB, and memory figures mean what they say.
    ghc-options:
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-N --disable-delayed-os-memory-return"'
    dependencies:
      - haskoin-store
      - filepath ^>= 1.5.5.0
      - optparse-applicative ^>= 0.19.0.0
tests:
  spec:
    main: Spec.hs
    source-dirs: test
    verbatim:
      build-tool-depends:
        hspec-discover:hspec-discover
    ghc-options:
      - -threaded
      - -rtsopts
      # -T lets the memory test read the heap size; -M4g makes a runaway
      # test fail with heap overflow instead of exhausting the machine
      - '"-with-rtsopts=-N4 -T -M4g"'
    dependencies:
      - haskoin-store
      - hspec ^>= 2.11.18
      - QuickCheck ^>= 2.17.1.0
      - base64 ^>= 1.0.1
      - fast-logger ^>= 3.2.9
      - integration
benchmarks:
  # Load-test server: syncs a synthetic chain and serves the web API on it.
  # Build with `stack build --bench --no-run-benchmarks` and run it with
  # scripts/bench-web.sh.
  haskoin-store-bench:
    main: Main.hs
    source-dirs: bench
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - haskoin-store
      - vector ^>= 0.13.2.0
  # Stress test of the Redis cache: regtest chain and Valkey in Podman, a
  # haskoin-store server, hundreds of thousands of transactions between a
  # few wallets, and wrk on their xpubs. Run it with scripts/stress-cache.sh.
  haskoin-store-stress:
    main: Main.hs
    source-dirs: stress
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N2
    dependencies:
      - haskoin-store
      - integration
      - process ^>= 1.6.26.1
      - optparse-applicative ^>= 0.19.0.0
