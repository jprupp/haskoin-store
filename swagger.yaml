              schema:
                type: string

components:
  schemas:

    BlockRef:
      description: |
        Where a transaction or output is: in a block, with its height and position,
        or in the mempool, with the time this server first saw it. A transaction
        moves from one form to the other when it is confirmed, or back after a
        reorganisation.
      oneOf:
        - $ref: '#/components/schemas/Block'
        - $ref: '#/components/schemas/Mempool'

    Block:
      type: object
      description: |
        A place in a block.
      required:
        - height
        - position
      properties:
        height:
          type: integer
          description: |
            Height of the block.
        position:
          type: integer
          description: |
            Position of the transaction in the block, from 0.

    Mempool:
      type: object
      description: |
        A place in the mempool.
      required:
        - mempool
      properties:
        mempool:
          type: integer
          description: |
            Unix time when this server first saw the transaction. Other servers may
            have seen it at another time; it orders the unconfirmed transactions.
          format: int64

    XPubBalance:
      type: object
      description: |
        The balance of one address of a wallet, with its derivation path below the
        extended public key.
      required:
        - path
        - balance
      properties:
        path:
          $ref: '#/components/schemas/XPubPath'
        balance:
          $ref: '#/components/schemas/Balance'

    XPubPath:
      type: array
      description: |
        Derivation path of an address below the extended public key: the chain
        (`0` receiving, `1` change) and the index of the address in it, so `[1, 4]`
        is the fifth change address.
      items:
        type: integer

    XPubUnspent:
      type: object
      description: |
        An unspent output of a wallet, with the derivation path of its address, so
        the wallet knows which key signs for it.
      required:
        - path
        - unspent
      properties:
        path:
          $ref: '#/components/schemas/XPubPath'
        unspent:
          $ref: '#/components/schemas/Unspent'

    XPubSummary:
      type: object
      description: |
        The balance of a wallet and how far it has used its addresses.
      required:
        - balance
        - indices
      properties:
        balance:
          type: object
          description: |
            Totals over every address of the wallet, in satoshis: `confirmed`,
            `unconfirmed` and `received` as in an address balance, and `utxo`, the
            number of unspent outputs.
          required:
            - confirmed
            - unconfirmed
            - received
            - utxo
          properties:
            confirmed:
              description: Confirmed balance for all addresses.
              type: integer
            unconfirmed:
              description: Unconfirmed balance for all addresses.
              type: integer
            received:
              description: Total received on all external addresses.
              type: integer
            utxo:
              description: Unspent transaction output count.
              type: integer
        indices:
          type: object
          description: |
            Index of the last used address of the receiving chain (`external`) and of
            the change chain (`change`). The next unused address is one past it.
          required:
            - external
            - change
          properties:
            external:
              type: integer
            change:
              type: integer

    TxRef:
      type: object
      description: |
        A transaction id and where the transaction is. Lists of transactions return
        these rather than full transactions, which are much larger; fetch the ones
        you need.
      required:
        - block
        - txid
      properties:
        block:
          $ref: '#/components/schemas/BlockRef'
        txid:
          type: string
          description: |
            Transaction id.

    Balance:
      type: object
      description: |
        The balance of an address. `confirmed` plus `unconfirmed` is what the address
        holds now, counting unconfirmed transactions; `confirmed` alone is what it
        holds in coins that are in blocks and are not being spent.
      required:
        - address
        - confirmed
        - unconfirmed
        - utxo
        - received
        - txs
      properties:
        address:
          type: string
          description: |
            The address.
        confirmed:
          type: integer
          description: |
            Sum of the unspent outputs of the address that are confirmed, in satoshis.
            An output spent by an unconfirmed transaction no longer counts.
          format: int64
        unconfirmed:
          type: integer
          description: |
            Sum of the unspent outputs of the address that are not confirmed yet, in
            satoshis.
          format: int64
        utxo:
          type: integer
          description: |
            Number of unspent outputs.
          format: int64
        received:
          type: integer
          description: |
            Total ever paid to the address, spent or not, confirmed or not, in
            satoshis.
          format: int64
        txs:
          type: integer
          description: |
            Number of transactions that pay to or spend from the address.
          format: int64

    Unspent:
      type: object
      description: |
        An output that is not spent yet: a coin that can be spent.
      required:
        - address
        - block
        - txid
        - index
        - pkscript
        - value
      properties:
        address:
          type: string
          description: |
            Address of the output. Null for scripts that have no address, such as
            data outputs or bare multisig.
          nullable: true
        block:
          $ref: '#/components/schemas/BlockRef'
        txid:
          type: string
          description: |
            Id of the transaction that created the output.
        index:
          type: integer
          description: |
            Position of the output in that transaction, from 0.
        pkscript:
          type: string
          description: |
            Output script in hexadecimal, needed to sign a spend.
        value:
          type: integer
          description: |
            Value in satoshis.
          format: int64

    BlockData:
      type: object
      description: |
        A block, with its header and what the server computed from it.
      required:
        - hash
        - height
        - mainchain
        - previous
        - time
        - version
        - bits
        - nonce
        - size
        - tx
        - merkle
        - subsidy
        - fees
        - outputs
        - work
      properties:
        hash:
          type: string
          description: |
            Block hash.
        size:
          type: integer
          description: |
            Size of the serialized block, in bytes, witness data included.
        height:
          type: integer
          description: |
            Height in its chain.
        mainchain:
          type: boolean
          description: |
            Whether the block is in the chain with the most work. Blocks of chains
            abandoned in a reorganisation are kept, with `false`.
        previous:
          type: string
          description: |
            Hash of the previous block.
        time:
          type: integer
          description: |
            Timestamp set by the miner, as a Unix time. Only roughly right.
          format: int64
        version:
          type: integer
          description: |
            Block version.
          format: int64
        bits:
          type: integer
          description: |
            Proof-of-work target, in compact form.
          format: int64
        nonce:
          type: integer
          description: |
            Nonce found by the miner.
          format: int64
        tx:
          type: array
          description: |
            Ids of the transactions, in order; the first is the coinbase.
          items:
            type: string
        merkle:
          type: string
          description: |
            Merkle root of the transactions.
        subsidy:
          type: integer
          description: |
            New coins created by the block, in satoshis.
          format: int64
        fees:
          type: integer
          description: |
            Sum of the fees of its transactions, in satoshis.
          format: int64
        outputs:
          type: integer
          description: |
            Sum of the outputs of its transactions, in satoshis.
          format: int64
        weight:
          type: integer
          description: |
            Block weight, on networks with SegWit only.
        work:
          type: integer
          description: |
            Proof of work accumulated by the chain up to this block.

    Input:
      type: object
      description: |
        An input of a transaction, with the address and value of the output it
        spends, which the raw transaction does not contain and which the server
        looks up.
      required:
        - coinbase
        - txid
        - output
        - sigscript
        - sequence
        - pkscript
        - witness
        - value
        - address
      properties:
        coinbase:
          type: boolean
          description: |
            Whether this is the input of a coinbase, which spends nothing.
        txid:
          type: string
          description: |
            Id of the transaction whose output is spent.
        output:
          type: integer
          description: |
            Position of that output in its transaction.
        sigscript:
          type: string
          description: |
            Input script in hexadecimal.
        value:
          type: integer
          description: |
            Value of the output spent, in satoshis.
          format: int64
          nullable: true
        sequence:
          type: integer
          description: |
            Sequence number.
          format: int64
        address:
          type: string
          description: |
            Address of the output spent; null if it has none.
          nullable: true
        pkscript:
          type: string
          description: |
            Script of the output spent, in hexadecimal.
          nullable: true
        witness:
          type: array
          description: |
            Witness stack, each item in hexadecimal; empty without SegWit.
          items:
            type: string

    Spender:
      type: object
      description: |
        The input that spends an output.
      required:
        - txid
        - input
      properties:
        txid:
          type: string
          description: |
            Id of the spending transaction.
        input:
          type: integer
          description: |
            Position of the input in that transaction.

    Output:
      type: object
      description: |
        An output of a transaction, with whether and by what it is spent.
      required:
        - address
        - pkscript
        - value
        - spent
      properties:
        address:
          type: string
          description: |
            Address of the output; null for scripts without one.
          nullable: true
        pkscript:
          type: string
          description: |
            Output script in hexadecimal.
        value:
          type: integer
          description: |
            Value in satoshis.
          format: int64
        spent:
          type: boolean
          description: |
            Whether a transaction spends it, confirmed or not.
        spender:
          description: |
            The input that spends it, if any.
          allOf:
            - $ref: '#/components/schemas/Spender'

    Transaction:
      type: object
      description: |
        A transaction with what the server knows about it beyond its raw form: its
        place in the chain, its fee, and, for each input and output, the address and
        value involved.
      required:
        - txid
        - size
        - version
        - locktime
        - fee
        - inputs
        - outputs
        - block
        - deleted
        - time
        - rbf
        - weight
      properties:
        txid:
          type: string
          description: |
            Transaction id.
        size:
          type: integer
          description: |
            Size of the serialized transaction, in bytes, witness data included.
        version:
          type: integer
          description: |
            Transaction version.
          format: int64
        locktime:
          type: integer
          description: |
            Lock time.
          format: int64
        fee:
          type: integer
          description: |
            Fee in satoshis: inputs minus outputs; 0 for a coinbase.
          format: int64
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Input'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/Output'
        block:
          $ref: '#/components/schemas/BlockRef'
        deleted:
          type: boolean
          description: |
            Whether the transaction was removed: replaced by fee, double-spent by a
            confirmed transaction, or the coinbase of a block that left the main chain
            in a reorganisation. Deleted
            transactions count in no balance or history, but still answer by id, so a
            wallet can say what became of them.
        time:
          type: integer
          description: |
            Timestamp of its block, or, if unconfirmed, the Unix time this server first
            saw it.
          format: int64
        rbf:
          type: boolean
          description: |
            Whether the transaction can still be replaced by one paying a higher fee:
            it signals replace-by-fee (BIP 125), or spends an unconfirmed transaction
            that does. Only meaningful while unconfirmed, and on BTC.
        weight:
          type: integer
          description: |
            Transaction weight, as SegWit counts it.

    Event:
      type: object
      description: |
        Something that happened, as `/events` sends it.
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: |
            `block` for a new best block, `tx` for a mempool change.
          enum:
            - tx
            - block
        id:
          type: string
          description: |
            Hash of the block or id of the transaction.

    Peer:
      type: object
      description: |
        A node of the peer-to-peer network that the server is connected to.
      required:
        - useragent
        - address
        - version
        - services
        - relay
      properties:
        useragent:
          type: string
          description: |
            Software of the peer, as it announces itself.
        address:
          type: string
          description: |
            Network address of the peer.
        version:
          type: integer
          description: |
            Protocol version from the version message of the peer.
          format: int32
        services:
          type: string
          description: |
            Services the peer offers, as a bit field in hexadecimal.
        relay:
          type: boolean
          description: |
            Whether the peer relays transactions.

    BlockHealth:
      type: object
      description: |
        Whether the blocks are caught up with the headers.
      required:
        - headers
        - blocks
        - diff
        - max
        - ok
      properties:
        headers:
          type: integer
          description: |
            Height of the newest header.
        blocks:
          type: integer
          description: |
            Height of the newest imported block.
        diff:
          type: integer
          description: |
            Headers minus blocks.
        max:
          type: integer
          description: |
            Most blocks the server may be behind and still be healthy.
        ok:
          type: boolean
          description: |
            Whether `diff` is at most `max`.

    TimeHealth:
      type: object
      description: |
        Whether something happened recently enough.
      required:
        - age
        - max
        - ok
      properties:
        age:
          type: integer
          description: |
            Seconds since it happened.
        max:
          type: integer
          description: |
            Most seconds allowed.
        ok:
          type: boolean
          description: |
            Whether `age` is at most `max`.

    CountHealth:
      type: object
      description: |
        Whether there are enough of something.
      required:
        - count
        - min
        - ok
      properties:
        count:
          type: integer
          description: |
            How many there are.
        min:
          type: integer
          description: |
            How many are needed.
        ok:
          type: boolean
          description: |
            Whether `count` is at least `min`.

    MaxHealth:
      type: object
      description: |
        Whether there are not too many of something.
      required:
        - count
        - max
        - ok
      properties:
        count:
          type: integer
          description: |
            How many there are.
        max:
          type: integer
          description: |
            Most allowed.
        ok:
          type: boolean
          description: |
            Whether `count` is at most `max`.

    HealthCheck:
      type: object
      description: |
        The result of the latest health check. `ok` is true when every check passes.
        The limits are set by the operator of the server.
      required:
        - blocks
        - last-block
        - last-tx
        - pending-txs
        - peers
        - net
        - version
        - ok
      properties:
        blocks:
          description: |
            Whether the imported blocks have caught up with the headers.
          allOf:
            - $ref: '#/components/schemas/BlockHealth'
        last-block:
          description: |
            Age of the newest header. A network that has found no block for hours
            usually means the server lost touch with it.
          allOf:
            - $ref: '#/components/schemas/TimeHealth'
        last-tx:
          description: |
            Age of the newest unconfirmed transaction (or block, if newer). A busy
            network sends transactions all the time, so silence means trouble.
          allOf:
            - $ref: '#/components/schemas/TimeHealth'
        pending-txs:
          description: |
            Transactions received but not imported yet.
          allOf:
            - $ref: '#/components/schemas/MaxHealth'
        peers:
          description: |
            Connected peers.
          allOf:
            - $ref: '#/components/schemas/CountHealth'
        net:
          type: string
          description: |
            Network of the server.
        version:
          type: string
          description: |
            Version of Haskoin Store.
        ok:
          type: boolean
          description: |
            Whether every check passed.
        time:
          type: string
          description: |
            When the check ran.

    Error:
      type: object
      description: |
        An error. `error` is a stable code for programs to test; `message` is for
        people and may change. See *Errors* at the top.
      required:
        - error
      properties:
        error:
          type: string
          description: |
            Error code, such as `not-found-or-invalid-arg` or `user-error`.
          example: not-found-or-invalid-arg
        message:
          type: string
          description: |
            What went wrong, for people.
          example: Item not found or argument invalid
    TxId:
      type: object
      description: |
        The id of a transaction.
      required:
        - txid
      properties:
        txid:
          type: string
          description: |
            Transaction id.

    BinfoTxIdHash:
      type: string

    BinfoTxIdIndex:
      type: integer

    BinfoTxId:
      description: |
        A transaction id in hexadecimal, or its short number (see the `txidindex`
        parameter).
      oneOf:
        - $ref: '#/components/schemas/BinfoTxIdHash'
        - $ref: '#/components/schemas/BinfoTxIdIndex'
      example: 2d05f0c9c3e1c226e63b5fac240137687544cf631cd616fd34fd188fc9020866

    BinfoWallet:
      type: object
      required:
        - final_balance
        - n_tx
        - n_tx_filtered
        - total_received
        - total_sent
      properties:
        final_balance:
          type: integer
        n_tx:
          type: integer
          description: |
            Number of transactions of the addresses and extended public keys
            shown (`onlyShow`, or all the active ones), each counted once, not
            only those on this page.
        n_tx_filtered:
          type: integer
          description: |
            Number of those transactions that pass the `filter`, not only
            those on this page.
        total_received:
          type: integer
        total_sent:
          type: integer


    BinfoSymbol:
      type: object
      required:
        - code
        - symbol
        - name
        - conversion
        - symbolAppearsAfter
        - local
      properties:
        code:
          type: string
        symbol:
          type: string
        name:
          type: string
        conversion:
          type: number
          format: double
        symbolAppearsAfter:
          type: boolean
        local:
          type: boolean

    BinfoBlockInfo:
      type: object
      required:
        - hash
        - height
        - time
        - block_index
      properties:
        hash:
          type: string
        height:
          type: integer
        time:
          type: integer
        block_index:
          type: integer

    BinfoInfo:
      type: object
      required:
        - nconnected
        - conversion
        - symbol_local
        - symbol_btc
        - latest_block
      properties:
        nconnected:
          type: integer
        conversion:
          type: number
          format: double
        symbol_local:
          $ref: '#/components/schemas/BinfoSymbol'
        symbol_btc:
          $ref: '#/components/schemas/BinfoSymbol'
        latest_block:
          $ref: '#/components/schemas/BinfoBlockInfo'

    BinfoXPubBalance:
      type: object
      required:
        - address
        - final_balance
        - n_tx
        - total_received
        - total_sent
        - account_index
        - change_index
      properties:
        address:
          type: string
        final_balance:
          type: integer
          format: int64
        n_tx:
          type: integer
        total_received:
          type: integer
          format: int64
        total_sent:
          type: integer
          format: int64
        account_index:
          type: integer
        change_index:
          type: integer


    BinfoAddrBalance:
      type: object
      required:
        - address
        - final_balance
        - n_tx
        - total_received
        - total_sent
      properties:
        address:
          type: string
        final_balance:
          type: integer
          format: int64
        n_tx:
          type: integer
        total_received:
          type: integer
          format: int64
        total_sent:
          type: integer
          format: int64

    BinfoRawAddr:
      type: object
      required:
        - hash160
        - address
        - n_tx
        - n_unredeemed
        - total_received
        - total_sent
        - final_balance
        - txs
      properties:
        hash160:
          type: string
        address:
          type: string
        n_tx:
          type: integer
          description: |
            Number of transactions of the address or extended public key, not
            only those on this page.
        n_unredeemed:
          type: integer
        total_received:
          type: integer
          format: int64
        total_sent:
          type: integer
          format: int64
        final_balance:
          type: integer
          format: int64
        txs:
          type: array
          items:
            $ref: '#/components/schemas/BinfoTx'

    BinfoBalance:
      oneOf:
        - $ref: '#/components/schemas/BinfoXPubBalance'
        - $ref: '#/components/schemas/BinfoAddrBalance'

    BinfoShortBalance:
      type: object
      required:
        - final_balance
        - n_tx
        - total_received
      properties:
        final_balance:
          type: integer
          format: int64
        n_tx:
          type: integer
        total_received:
          type: integer
          format: int64

    BinfoMultiAddr:
      type: object
      required:
        - wallet
        - info
        - addresses
        - recommend_include_fee
      properties:
        wallet:
          $ref: '#/components/schemas/BinfoWallet'
        info:
          $ref: '#/components/schemas/BinfoInfo'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/BinfoBalance'
        txs:
          type: array
          items:
            $ref: '#/components/schemas/BinfoTx'
        recommend_include_fee:
          type: boolean
        cash_addr:
          type: boolean

    BinfoTxInput:
      type: object
      required:
        - index
        - script
        - prev_out
        - sequence
        - witness
      properties:
        index:
          type: integer
        script:
          type: string
        prev_out:
          $ref: '#/components/schemas/BinfoTxOutput'
        sequence:
          type: integer
        witness:
          type: string

    BinfoXPubPath:
      type: object
      required:
        - 'm'
        - path
      properties:
        m:
          type: string
        path:
          type: string

    BinfoSpender:
      type: object
      required:
        - tx_index
        - 'n'
      properties:
        tx_index:
          $ref: '#/components/schemas/BinfoTxId'
        n:
          type: integer

    BinfoTxOutput:
      type: object
      required:
        - tx_index
        - 'n'
        - type
        - spent
        - value
        - spending_outpoints
        - script
      properties:
        type:
          type: integer
        spent:
          type: boolean
        value:
          type: integer
          format: int64
        spending_outpoints:
          $ref: '#/components/schemas/BinfoSpender'
        n:
          type: integer
        tx_index:
          $ref: '#/components/schemas/BinfoTxId'
        script:
          type: string
        addr:
          type: string
        xpub:
          $ref: '#/components/schemas/BinfoXPubPath'

    BinfoHeader:
      type: object
      required:
        - hash
        - time
        - block_index
        - height
        - txIndexes
      properties:
        hash:
          type: string
        time:
          type: integer
        block_index:
          type: integer
        height:
          type: integer
        txIndexes:
          type: array
          items:
            $ref: '#/components/schemas/BinfoTxId'


    BinfoBlock:
      type: object
      required:
        - hash
        - ver
        - prev_block
        - mrkl_root
        - time
        - bits
        - next_block
        - fee
        - nonce
        - n_tx
        - size
        - block_index
        - main_chain
        - height
        - weight
        - tx
      properties:
        hash:
          type: string
        ver:
          type: integer
        prev_block:
          type: string
        mrkl_root:
          type: string
        time:
          type: integer
        bits:
          type: integer
        next_block:
          type: array
          items:
            type: string
        fee:
          type: integer
          format: int64
        nonce:
          type: integer
        n_tx:
          type: integer
        size:
          type: integer
        block_index:
          type: integer
        main_chain:
          type: boolean
        height:
          type: integer
        weight:
          type: integer
        tx:
          type: array
          items:
            $ref: '#/components/schemas/BinfoTx'

    BinfoHistory:
      type: object
      required:
        - date
        - time
        - type
        - amount
        - value_then
        - value_now
        - exchange_rate_then
        - tx
        - fee
      properties:
        date:
          type: string
        time:
          type: string
        type:
          type: string
          enum:
            - sent
            - received
        amount:
          type: number
        value_then:
          type: number
        value_now:
          type: number
        exchange_rate_then:
          type: number
        tx:
          type: string
        fee:
          type: number

    BinfoTx:
      type: object
      required:
        - hash
        - ver
        - vin_sz
        - vout_sz
        - size
        - weight
        - fee
        - relayed_by
        - lock_time
        - tx_index
        - double_spend
        - time
        - block_index
        - block_height
        - inputs
        - out
      properties:
        hash:
          type: string
        ver:
          type: integer
        vin_sz:
          type: integer
        vout_sz:
          type: integer
        size:
          type: integer
        weight:
          type: integer
        fee:
          type: integer
          format: int64
        relayed_by:
          type: string
        lock_time:
          type: integer
        tx_index:
          $ref: '#/components/schemas/BinfoTxId'
        double_spend:
          type: boolean
        time:
          type: integer
        block_index:
          type: integer
        block_height:
          type: integer
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/BinfoTxInput'
        out:
          type: array
          items:
            $ref: '#/components/schemas/BinfoTxOutput'
        result:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
        rbf:
          type: boolean

    BinfoUnspent:
      type: object
      required:
        - tx_hash_big_endian
        - tx_hash
        - tx_output_n
        - script
        - value
        - value_hex
        - confirmations
        - tx_index
      properties:
        tx_hash_big_endian:
          type: string
        tx_hash:
          type: string
        tx_output_n:
          type: integer
        script:
          type: string
        value:
          type: integer
          format: int64
        value_hex:
          type: string
        confirmations:
          type: integer
        tx_index:
          $ref: '#/components/schemas/BinfoTxId'

    BinfoBalanceReq:
      type: object
      properties:
        active:
          type: array
          items:
            type: string
            example: "xpub6By8JDaPr5L6oHfgQDc47quD69qH1hTwnFYbuia8paiYxSE9u84K\
                     ZfYqn6xLMUqxKK3wNpsgP4Kwu1gzXHD5xBxj5HrLposEYL6PwZzpAMZ"
        activeP2SH:
          type: array
          items:
            type: string
        activeBech32:
          type: array
          items:
            type: string
        cashaddr:
          type: boolean
          example: true

    BinfoHistoryReq:
      type: object
      properties:
        active:
          type: array
          items:
            type: string
            example: "xpub6By8JDaPr5L6oHfgQDc47quD69qH1hTwnFYbuia8paiYxSE9u84K\
                     ZfYqn6xLMUqxKK3wNpsgP4Kwu1gzXHD5xBxj5HrLposEYL6PwZzpAMZ"
        activeP2SH:
          type: array
          items:
            type: string
        activeBech32:
          type: array
          items:
            type: string
        currency:
          type: string
          example: eur
        start:
          type: string
          example: 20-10-2020
        end:
          type: string
          example: 09-04-2021

    BinfoMultiAddrReq:
      type: object
      properties:
        active:
          type: array
          items:
            type: string
            example: "xpub6By8JDaPr5L6oHfgQDc47quD69qH1hTwnFYbuia8paiYxSE9u84K\
                     ZfYqn6xLMUqxKK3wNpsgP4Kwu1gzXHD5xBxj5HrLposEYL6PwZzpAMZ"
        activeP2SH:
          type: array
          items:
            type: string
        activeBech32:
          type: array
          items:
            type: string
        onlyShow:
          type: array
          items:
            type: string
        n:
          type: integer
          example: 2
        offset:
          type: integer
          example: 5
        noCompact:
          type: boolean
          example: false
        currency:
          type: string
          example: eur
        cashaddr:
          type: boolean
          example: true
        txidindex:
          type: boolean
          example: true
        filter:
          type: integer
          enum: [0,1,2,3,5,7]
          example: 5

    BinfoUnspentReq:
      type: object
      properties:
        active:
          type: array
          items:
            type: string
            example: "xpub6By8JDaPr5L6oHfgQDc47quD69qH1hTwnFYbuia8paiYxSE9u84K\
                     ZfYqn6xLMUqxKK3wNpsgP4Kwu1gzXHD5xBxj5HrLposEYL6PwZzpAMZ"
        activeP2SH:
          type: array
          items:
            type: string
        activeBech32:
          type: array
          items:
            type: string
        onlyShow:
          type: array
          items:
            type: string
        limit:
          type: integer
          example: 2
        confirmations:
          type: integer
          example: 6
        txidindex:
          type: boolean
          example: true

  parameters:

    pubKeyParam:
      name: pubkey
      in: path
      description: |
        A public key in hexadecimal, compressed or not.
      required: true
      schema:
        type: string
        example: 027eb504988cbc043dd4c9fac51685d68718a24d7f9f1d4c07b9f8c3d04327794c

    addressParam:
      name: address
      in: path
      description: |
        An address of the network of the server. An address that does not parse,
        or is of another network, gives 404.
      required: true
      schema:
        type: string
      example: qqmaqu9nceck5ct5pqrjy4ulhhw66wdlkv2s7f2l9u

    hashParam:
      name: hash
      in: path
      description: |
        A hash160 (20 bytes) in hexadecimal.
      required: true
      schema:
        type: string
      example: 37d070b3c6716a6174080722579fbdddad39bfb3

    addressesParam:
      name: addresses
      in: query
      description: |
        Addresses, separated by commas. Every address must be valid: one that is not
        fails the whole request with 400, rather than giving an answer that silently
        leaves it out.
      explode: false
      required: true
      schema:
        type: array
        items:
          type: string
        example:
          - qqmaqu9nceck5ct5pqrjy4ulhhw66wdlkv2s7f2l9u
          - qql2wpu4fa36yf07gcc8q80sjfxfaq66xssezyukg2

    limitParam:
      name: limit
      in: query
      description: |
        How many items to return at most. Without it, the server's default (100
        unless the operator changed it). `0` asks for the server's maximum. A
        larger number is lowered to the maximum rather than refused. See *Paging* at
        the top.
      required: false
      schema:
        type: integer

    heightParam:
      name: height
      in: query
      description: |
        Where the page starts: a transaction id (included), a block hash, a block
        height (transactions confirmed at or below it), or a Unix time (the last
        block at or before it). Numbers up to 1,230,768,000 are heights, larger ones
        times. Unconfirmed transactions come first in every list, so a height below
        the best block leaves them out.

        To get the next page, pass the id of the last transaction you received here,
        with `offset=1`. See *Paging* at the top for why this is better than a large
        offset.
      required: false
      schema:
        oneOf:
          - type: integer
          - type: string

    offsetParam:
      name: offset
      in: query
      description: |
        How many items to skip after the start. Above the server's maximum (50,000
        unless the operator changed it), the request fails with 400; use `height` to
        go further back.
      required: false
      schema:
        type: integer

    nocacheParam:
      name: nocache
      in: query
      description: |
        Answer from the database of this server, without reading the Redis cache and
        without caching the wallet. The answer is the same; this is for comparing,
        and for servers whose cache is shared with others that may be ahead of or
        behind this one.
      required: false
      schema:
        type: boolean

    notxParam:
      name: notx
      in: query
      description: |
        Leave out the transaction ids, except the first (the coinbase). A block can
        have thousands of transactions, and pages that list blocks rarely need them.
      required: false
      schema:
        type: boolean

    blockParam:
      name: block
      in: path
      description: |
        A block hash in hexadecimal.
      required: true
      schema:
        type: string
        example: 000000000003ba27aa200b1cecaad478d2b00432346c3f1f3986da1afd33e506

    blocksParam:
      name: blocks
      in: query
      description: |
        Block hashes in hexadecimal, separated by commas.
      explode: false
      required: true
      schema:
        type: array
        items:
          type: string
        example:
          - 000000001aeae195809d120b5d66a39c83eb48792e068f8ea1fea19d84a4278a
          - 000000000845517b31c6820d83f25cff46429bf136a7515fe504116427e60f8e

    blockHeightParam:
      name: height
      in: path
      description: |
        A block height. The first block is at height 0.
      required: true
      schema:
        type: integer
      example: 200

    blockHeightsParam:
      name: heights
      in: query
      description: |
        Block heights, separated by commas.
      explode: false
      required: true
      schema:
        type: array
        items:
          type: integer
        example:
          - 100
          - 200
          - 300

    txidParam:
      name: txid
      in: path
      description: |
        A transaction id in hexadecimal.
      required: true
      schema:
        type: string
        example: 03c16602a41ae7cbc2a25b0d2801fdc3295e2e8ebfb26774030b2f7d538f5568

    timeParam:
      name: time
      in: path
      description: |
        A Unix timestamp, in seconds.
      required: true
      schema:
        type: integer
        example: 1231753120

    txidsParam:
      name: txids
      in: query
      description: |
        Transaction ids in hexadecimal, separated by commas.
      explode: false
      required: true
      schema:
        type: array
        items:
          type: string
        example:
          - 03c16602a41ae7cbc2a25b0d2801fdc3295e2e8ebfb26774030b2f7d538f5568
          - 02ea64dfff60b1f215282bbb4b2d729fecc50d81d2d0ef09a60d550a5a69418f

    xpubParam:
      name: xpub
      in: path
      description: |
        An extended public key of the network of the server: `xpub` on BTC and BCH,
        `tpub` on test networks. Keys that wallets export as `ypub` or `zpub` are
        not accepted; export them as `xpub` and say the kind of address with
        `derive`.
      required: true
      schema:
        type: string
        example: "xpub6By8JDaPr5L6oHfgQDc47quD69qH1hTwnFYbuia8paiYxSE9u84K\
                 ZfYqn6xLMUqxKK3wNpsgP4Kwu1gzXHD5xBxj5HrLposEYL6PwZzpAMZ"

    xpubDerive:
      name: derive
      in: query
      description: |
        The kind of address the wallet derives from the key:

        - `legacy`: pay-to-public-key-hash (P2PKH), addresses starting with `1`
          on BTC; the default, and the only kind on networks without SegWit, such as
          BCH. `normal`, its name up to version 1.8, is still accepted, so old
          URLs keep working;
        - `compat`: SegWit nested in pay-to-script-hash (P2SH-P2WPKH), addresses
          starting with `3`, as BIP 49 wallets use;
        - `segwit`: native SegWit (P2WPKH), addresses starting with `bc1q`, as BIP
          84 wallets use.

        An xpub does not record which kind its wallet uses, and each kind gives
        different addresses from the same key. When the wallet has no
        transactions with this kind but has some with another, the request
        fails with 400 and a message that names the right kind, rather than
        answering with an empty wallet.
      required: false
      schema:
        type: string
        enum: [legacy, compat, segwit, normal]
        default: legacy

    prettyParam:
      name: pretty
      in: query
      description: |
        Indent the JSON, for people to read. Responses are compact by default to
        save bandwidth.
      required: false
      schema:
        type: boolean

    binfoAddr:
      name: address
      in: path
      description: |
        An address or an extended public key.
      required: true
      schema:
        type: string
      example: qqmaqu9nceck5ct5pqrjy4ulhhw66wdlkv2s7f2l9u

    binfoActive:
      name: active
      in: query
      description: |
        Addresses and extended public keys of the wallet, separated by `|` or `,`.
        Extended public keys here derive legacy (P2PKH) addresses.
      required: false
      schema:
        type: string
        example: "xpub6By8JDaPr5L6oHfgQDc47quD69qH1hTwnFYbuia8paiYxSE9u84K\
                 ZfYqn6xLMUqxKK3wNpsgP4Kwu1gzXHD5xBxj5HrLposEYL6PwZzpAMZ"

    binfoActiveP2SH:
      name: activeP2SH
      in: query
      description: |
        Extended public keys that derive SegWit addresses nested in
        pay-to-script-hash (P2SH-P2WPKH), separated by `|` or `,`.
      required: false
      schema:
        type: string

    binfoActiveBech32:
      name: activeBech32
      in: query
      description: |
        Extended public keys that derive native SegWit (P2WPKH) addresses, separated
        by `|` or `,`.
      required: false
      schema:
        type: string

    binfoOnlyShow:
      name: onlyShow
      in: query
      description: |
        The addresses and extended public keys, among the active ones, whose
        balances to list and from whose point of view to compute the result of each
        transaction, separated by `|` or `,`. All the active ones if left out.
      required: false
      schema:
        type: string

    binfoFilter:
      name: filter
      in: query
      description: |
        Which transactions to list (`0` or `6` for all of them):

        - `1`: those that send coins out of the wallet;
        - `2`: those that bring coins into the wallet;
        - `3`: those that move coins within the wallet, changing its balance by
          the fee only;
        - `5`: confirmed ones;
        - `7`: unconfirmed ones.
      required: false
      schema:
        type: integer
        enum: [0,1,2,3,5,7]
      example: 5

    binfoLimit:
      name: limit
      in: query
      description: |
        How many items to return at most. The default and maximum are those of the
        server.
      required: false
      schema:
        type: integer
        example: 2

    binfoCount:
      name: n
      in: query
      description: |
        How many transactions to return at most. The default and maximum are those
        of the server for full transactions.
      required: false
      schema:
        type: integer
        example: 2

    binfoOffset:
      name: offset
      in: query
      description: |
        How many items to skip at the start. Above the server's maximum, the request
        fails with 400.
      required: false
      schema:
        type: integer

    binfoConfirmations:
      name: confirmations
      in: query
      description: |
        Only return outputs with at least this many confirmations. `0`, the default,
        includes unconfirmed ones.
      required: false
      schema:
        type: integer

    binfoNoCompact:
      name: noCompact
      in: query
      description: |
        Keep the outputs of incoming transactions that pay to other addresses. They
        are left out by default, as they belong to other people and can be many.
      required: false
      schema:
        type: boolean
        example: false

    binfoCurrency:
      name: currency
      in: query
      description: |
        The currency for the `info` section, such as `USD`, `EUR` or `GBP`, in any
        case. `USD` by default.
      required: false
      schema:
        type: string
        example: eur

    binfoCashAddr:
      name: cashaddr
      in: query
      description: |
        Write Bitcoin Cash addresses in CashAddr format. They are in the legacy
        format by default, as Blockchain.info writes them, so that software written
        for it reads them.
      required: false
      schema:
        type: boolean
        example: true

    binfoTxIdIndex:
      name: txidindex
      in: query
      description: |
        Identify transactions by their id (`true`) rather than by a short number
        (the default).

        Blockchain.info identifies transactions by a number, and software written
        for it expects one. The server derives it from the transaction id: the first
        64 bits, shifted right by 11, so that it fits in the 53 bits that numbers in
        JavaScript hold exactly. Two transactions can share a number, rarely; the
        ids never collide, so use them when you can.
      required: false
      schema:
        type: boolean
        example: true

    binfoBlockId:
      name: block
      in: path
      description: |
        A block hash in hexadecimal, or a block height.
      required: true
      schema:
        oneOf:
          - type: string
          - type: integer
      example: 50000

    binfoTxId:
      name: txid
      in: path
      description: |
        A transaction id in hexadecimal, or the short number of a transaction (see
        `txidindex`).
      required: true
      schema:
        oneOf:
          - type: string
          - type: integer
      example: 369c2a28fc84b060e4423e26ac898fa4ce9eda8943a36d0a48df66e6a6275aa6

    binfoFormat:
      name: format
      in: query
      description: |
        `json`, the default, or `hex` for the data serialized as in the peer-to-peer
        protocol.
      required: false
      schema:
        type: string
        enum:
          - json
          - hex

    binfoStart:
      name: start
      in: query
      description: |
        The first day of the history, as `dd-mm-yyyy` or `dd/mm/yyyy`.
      required: true
      schema:
        type: string
        example: 20-10-2020

    binfoEnd:
      name: end
      in: query
      description: |
        The last day of the history, included, as `dd-mm-yyyy` or `dd/mm/yyyy`.
      required: true
      schema:
        type: string
        example: 09-04-2021
