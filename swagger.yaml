  '/transaction/{txid}/after/{height}':
    get:
      tags:
        - Transaction
      operationId: cbAfterHeight
      summary: Hard Fork Safety Check
      description: |
        Whether any ancestor of a transaction is a coinbase mined after a height.

        This answers a question that matters after a chain split, such as the one
        between BTC and BCH: coins created by miners after the split exist on one
        chain only, so a transaction that descends from them cannot be replayed on
        the other chain. The server follows the inputs of the transaction back
        through its ancestors, and answers `true` as soon as it finds such a
        coinbase, `false` when every path ends in older blocks, and `null` when it
        gives up after looking at 10,000 transactions, so that one request cannot
        keep the server busy for long.
      parameters:
        - $ref: '#/components/parameters/txidParam'
        - $ref: '#/components/parameters/blockHeightParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: >-
            Specify height of last common block to find out if this transaction
            is invalid on alternate chain.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: boolean
                    nullable: true
                    example: true
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

