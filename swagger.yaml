  '/block/mtp/{time}':
    get:
      tags:
        - Block
      operationId: getBlockMTP
      summary: Block at Median Time Past
      description: |
        The first block of the main chain whose median time past is at or after a
        time.

        The median time past of a block is the median of the timestamps of the 11
        blocks up to it. Unlike the timestamps themselves, it never goes backwards,
        and it is the time that the consensus rules use for time locks, so it is the
        right one to answer "from which block on is this lock time reached".
      parameters:
        - $ref: '#/components/parameters/timeParam'
        - $ref: '#/components/parameters/notxParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: Block at Median Time Past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockData'
              example:
                hash: 000000007986095d6dce2f41fd76e8008e828282400e46d3b49f39d19e2b7a78
                height: 206
                mainchain: true
                previous: 00000000d7e3261b16abe2fc1811150812ee0d6f6fc3727cadd8821df2d96c45
                time: 1231757577
