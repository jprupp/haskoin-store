  '/blockchain/block-height/{height}':
    get:
      tags:
        - Blockchain
      operationId: getBinfoBlockHeight
      summary: Blocks at Height
      description: |
        The blocks at a height, with their transactions, as Blockchain.info answers.
      parameters:
        - name: height
          in: path
          required: true
          schema:
            type: integer
            example: 100
        - $ref: '#/components/parameters/binfoTxIdIndex'
      responses:
        '200':
          description: List of blocks with transaction data.
          content:
            application/json:
              schema:
                type: object
                required:
                  - blocks
                properties:
                  blocks:
                    type: array
                    items:
                      $ref: '#/components/schemas/BinfoBlock'
