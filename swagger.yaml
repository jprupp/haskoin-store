                  1eee80cebba451dc26f6423881b8836fe86a8388ac00000000"
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  '/mempool':
    get:
      tags:
        - Transaction
      operationId: getMempool
      summary: Mempool Transaction Hashes
      description: |
        The ids of the unconfirmed transactions, newest first, by the time this
        server first saw them.

        There is no maximum `limit` here: the mempool is bounded by the network, and
        ids are small.
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: List of transaction hashes from mempool.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - a60e3b0775e08877d0a8edac874090034f2fa55a15fb339b98b18abb5c8cbdf3
                - c9c50b1f75b4a69319c51ffae3a47df7de99b02089e696b711244fd4591eb51e
                - 11acbc09285f99d2cc11b707b61952258d554dcffe9a91ab0f6a22d1b06ac618
            application/octet-stream:
              schema:
                type: string
                format: binary

  '/events':
    get:
      tags:
        - Block
        - Transaction
      operationId: getEventStream
      parameters:
        - $ref: '#/components/parameters/prettyParam'
      summary: Stream Blocks and Transactions
      description: |
        A stream of what happens on the network: one event per new block and per
        transaction that enters or leaves the mempool, as one line of JSON each.

        ```
        {"type":"tx","id":"9a5c…"}
        {"type":"block","id":"0000000000000000000a1b…"}
        ```

        The same events are sent over a **WebSocket** at the same path, one JSON
        message each, for browsers. The server pings WebSocket clients every 30
        seconds and drops those that do not answer within 60.

        An event names what changed and nothing else, which keeps the stream small
        and the same for everyone; fetch the block or transaction if you need it. A
        client that falls more than 10,000 events behind is disconnected rather than
        having the server queue events for it without limit; reconnect, and catch up
        with the normal endpoints.
      responses:
        '200':
          description: Events stream each on one line.
          content:
            application/x-json-stream:
              schema:
                $ref: '#/components/schemas/Event'
              example:
                type: tx
                id: 3e225aa5d41b0f7560ee641f86b00728adc626102b348f9d319e0fdfd848a0db
            application/octet-stream:
              schema:
                type: string
                format: binary

  '/peers':
    get:
      tags:
        - Network
      operationId: getPeers
      parameters:
        - $ref: '#/components/parameters/prettyParam'
      summary: Connected Network Peers
      description: |
        The nodes of the peer-to-peer network that this server is connected to. It
        is where blocks and transactions come from, and where broadcast transactions
        go.
      responses:
        '200':
          description: List of peer objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peer'
              example:
                - useragent: /BCH Unlimited:1.9.2(EB32; AD12; 64bit)/
                  address: 162.250.189.42:8333
                  version: 80003
                  services: "0000000000000875"
                  relay: true
                - useragent: /BCH Unlimited:1.9.2(EB32; AD12; 64bit)/
                  address: 154.57.12.149:8331
                  version: 80003
                  services: "0000000000000875"
                  relay: true
                - useragent: /Bitcoin Cash Node:23.0.0(EB32.0)/
                  address: 206.189.127.50:8333
                  version: 70015
                  services: "0000000000000425"
                  relay: true
            application/octet-stream:
              schema:
                type: string
                format: binary

  '/xpub/{xpub}':
    get:
      tags:
        - Address
      operationId: getXPubSummary
      summary: Extended Public Key Summary
      description: |
        The summary of a wallet: its balance, and the index of the last used address
        of the receiving and of the change chain, so the wallet knows where to derive
        its next address.

        It is the cheapest way to check a wallet: it does not list transactions or
        outputs. See *Extended public keys* at the top for how the addresses are
        found.
      parameters:
        - $ref: '#/components/parameters/xpubParam'
        - $ref: '#/components/parameters/xpubDerive'
        - $ref: '#/components/parameters/nocacheParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: Information about extended public key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XPubSummary'
              example:
                balance:
                  confirmed: 84994
                  unconfirmed: 0
                  received: 137003577
                  utxo: 3
                indices:
                  change: 27
                  external: 73
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: |
            The wallet has no transactions with this `derive`, but has some with
            another kind of address; the message names it. A query parameter
            that does not parse also gives 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: user-error
                message: >-
                  This xpub has no transactions with derive=legacy, but has
                  some with derive=segwit; ask with derive=segwit.
        '404':
          description: Invalid extended public key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Address
      operationId: deleteCachedXPub
      summary: Delete Cached Extended Key
      description: |
        Remove a wallet from the Redis cache of this server, if it has one. The
        answer says whether it was cached.

        There is rarely a reason to call this: cached wallets are kept up to date
        with every block and transaction, and the least recently used ones are
        evicted when the cache is full. It is there to free memory, or to rule out
        the cache when looking into a problem.
      parameters:
        - $ref: '#/components/parameters/xpubParam'
        - $ref: '#/components/parameters/xpubDerive'
        - $ref: '#/components/parameters/nocacheParam'
      responses:
        '200':
          description: True if xpub got deleted from cache.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: boolean
                    nullable: false
                    example: true
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  '/xpub/{xpub}/transactions/full':
    get:
      tags:
