    post:
      tags:
        - Transaction
      summary: Broadcast Transaction
      description: |
        Send a signed transaction to the network, and get its id back.

        The body is the transaction in hexadecimal (white space is ignored) or as
        raw bytes. It must be in the format that nodes of the network read: on BCH,
        which has no SegWit, the format without witness data.

        **A 200 means the transaction was sent, not that the network accepted it.**
        The server does not validate transactions; it gives the transaction to half
        of its peers, which check it as they would any other. If they accept it, they
        relay it back, and it appears in the mempool and in balances within seconds.
        To know whether it was accepted, look for it with `/transaction/{txid}` or
        watch `/events`.

        Five seconds later the server asks those peers for the transaction back. A
        peer that accepted it sends it, and the server imports it like any other
        transaction it hears about; a peer that refused it has nothing to send.
      operationId: postTransaction
      requestBody:
        description: >-
          Publish Transaction. The body holds one transaction and nothing
          else. Bytes after the transaction are refused. The transaction is
          in the format that peers of the network read. A network without
          SegWit, such as Bitcoin Cash, takes the format without witness
          only.
        content:
          text/plain:
            schema:
              type: string
              description: Hex-encoded Bitcoin protocol transaction.
              example: "0200000001bd7d375bfc0a4ac4246ccefba4df1c635e5627b607bdc4af22282e\
                       cd5869d8f9010000006441f92d192c9e33b8184c58b88eb11f57a1eb5b5a2b0e\
                       72b326864021d9e946cd2a5275efcf385fbc0d9e7c8a76f9189d624efc00ff74\
                       657a52e47efc6ffa0bfe3b412102a20b2f9bd8b475252ad054fdedb49045bd40\
                       c8926b65f64e312dd821b243a37c000000000211180000000000001976a91434\
                       04e444809abd438d85eb18e8d07c796e364afe88ac399b7c00000000001976a9\
                       1486a7f1a2047ed6719fa1ad5484f15c37c104887c88ac00000000"
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Bitcoin protocol transaction.
      responses:
        '200':
          description: Transaction accepted by network peer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxId'
              example:
                txid: 0b7cb07d848959fbd02ad6e2ed21fac888b8e8011c6b8c5362d05c703066ae67
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Transaction rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Publishing transaction failed for one of these reasons:

            * No network peers available.
            * Timeout while publishing, most likely silent rejection.
            * Network peer disconnected while publishing transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

