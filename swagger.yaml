      tags:
        - Blockchain
      operationId: getAddressPubKey
      summary: Address Public Key
      description: |
        The public key of an address, in hexadecimal, as plain text.

        An address is a hash of its public key, so the key can only be found once the
        address has spent something: the server looks for an input that spends from
        the address among its recent transactions, and reads the key from it. An
        address that has never spent gives 404.
      parameters:
        - $ref: '#/components/parameters/addressParam'
      responses:
        '200':
          description: Address public key.
          content:
            text/plain:
              schema:
                type: string
                example: 027eb504988cbc043dd4c9fac51685d68718a24d7f9f1d4c07b9f8c3d04327794c
