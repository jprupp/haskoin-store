# Long values, such as the hexadecimal of transactions and blocks and the
# xpubs in the examples, are split into pieces of equal width with escaped line
# breaks in double quotes, which join the pieces with nothing between them, so
# that every line stays under 120 columns. An xpub used as a key is split the
# same way, as an explicit key ("? ").
openapi: 3.0.0

servers:
  - url: 'https://api.haskoin.com/bch/'
  - url: 'https://api.haskoin.com/btc/'
  - url: 'https://api.haskoin.com/bchtest4/'
  - url: 'https://api.haskoin.com/btctest4/'

info:
  version: &version 1.8.1
  title: Haskoin
  contact:
    name: JP Rupp
    url: https://github.com/jprupp
    email: jprupp@protonmail.ch
  license:
    name: MIT
    url: https://github.com/jprupp/haskoin-store/blob/master/haskoin-store/LICENSE
  description: |
    Haskoin Store indexes the Bitcoin (BTC) and Bitcoin Cash (BCH) block chains
    and answers the questions that a node cannot answer on its own: what is the
    balance of this address, which transactions belong to this wallet, which
    outputs can it spend. It connects to the peer-to-peer network itself, keeps
    its indices up to date with every block and every unconfirmed transaction,
    and serves them here.

    The servers of this reference are the public instance at api.haskoin.com, one per
    network: `btc`, `bch`, and their test networks `btctest4` and `bchtest4`. The
    same API is served by any Haskoin Store you run yourself.

    ## The basics

    - **Amounts** of coins are whole numbers of satoshis (1 coin is 100,000,000
      satoshis), never decimal numbers of coins: floating-point numbers cannot
      hold every satoshi amount exactly, and a balance that is off by one
      satoshi is a bug that is hard to find. Only prices in other currencies,
      in the Blockchain.info endpoints, are decimal.
    - **Hashes** of blocks and transactions are hexadecimal, in the byte order
      that nodes and block explorers display, so they can be copied between them
      and this API.
    - **Scripts and serialized data** are hexadecimal.
    - **Times** are Unix timestamps, in seconds.
    - **Addresses** are written as the network writes them: Base58 or Bech32 on
      BTC, CashAddr on BCH.

    ## Lists are newest first

    Every list of transactions or unspent outputs starts with the newest:
    unconfirmed transactions first, by the time this server first saw them, then
    confirmed ones, from the highest block down, and within a block from the last
    transaction to the first.

    This is the order in which wallets and explorers show activity, and the
    database is laid out in that order, so the first page of any list is a single
    lookup however long the history is.

    ## Paging

    Lists take three parameters:

    - `limit`: how many items to return. Without it the server returns its
      default number (100, unless the operator changed it). There is a maximum,
      lower for lists of full transactions, which are much larger; `limit=0`
      asks for that maximum.
    - `height`: where the page starts. It can be:
      - a **transaction id**: the page starts at that transaction, which is
        included;
      - a **block hash**: the page starts at that block;
      - a **block height**: the page starts at transactions confirmed at or below
        that height;
      - a **Unix time**: the page starts at the last block mined at or before
        that time.

      Numbers up to 1,230,768,000 are heights and larger ones are times. That
      number is midnight on 1 January 2009, before the first block, so no time
      of a block is mistaken for a height, and no chain will reach that height.
    - `offset`: how many items to skip after the start. The server has a
      maximum (50,000, unless the operator changed it).

    **To get the next page, pass the id of the last transaction you received as
    `height`, and `offset=1` to skip it.** An offset counts from the newest item,
    so every new transaction shifts every page by one, and a deep offset makes the
    server step over all the items before it. A transaction id is a fixed point:
    pages do not shift, and the server finds the start with one lookup however
    far back it is. The maximum offset is there because deep offsets are slow.

    ## Formats

    - **JSON** by default, without spaces, to keep responses small.
    - **Pretty JSON** with `pretty=true`, indented for people to read.
    - **Binary** with the header `Accept: application/octet-stream`: the compact
      serialization that the Haskell client in
      [haskoin-store-data](https://github.com/jprupp/haskoin-store-data)
      decodes. It is smaller and faster to decode than JSON, and meant for
      programs written with Haskoin.

    Endpoints that end in `/raw` return data serialized as in the peer-to-peer
    protocol, in hexadecimal inside JSON (`{"result": "0100…"}`), or as bytes
    with the binary format.

    ## Errors

    An error is a JSON object with a stable `error` code, for programs, and a
    `message`, for people:

    ```json
    {"error": "user-error", "message": "Unable to parse param limit"}
    ```

    | Status | `error` | When |
    | --- | --- | --- |
    | 400 | `user-error`, `bad-request` | A parameter or the body is wrong; the message says which. |
    | 404 | `not-found-or-invalid-arg` | The thing does not exist, or a value in the path is not valid. |
    | 409 | `multiple-tx-index` | A short transaction number matches several transactions. |
    | 500 | `server-error` | Something went wrong on the server; it is logged there. |
    | 503 | | Only from `/health`: the server is not ready. |

    A value in the path that does not parse, such as a misspelt address, gives
    404 rather than 400. Paths are matched by the shape of what is in them, and
    a segment that does not parse may belong to another endpoint (`/block/best`
    and `/block/{block}` share a prefix), so the server tries the others, and
    when none matches it answers that there is nothing there. Query parameters
    are not ambiguous, so a bad one gives 400, with its name in the message.

    A 409 comes only from the Blockchain.info endpoints, which can name a
    transaction by a short number; the error lists the matching ids in `txids`.

    The codes `server-timeout` and `request-too-large` are part of the format, for
    clients that decode it, but this version of the server does not send them.

    ## Unconfirmed transactions

    The mempool is indexed like the chain. A payment shows up in balances and
    histories as soon as this server sees it on the network, with
    `"block": {"mempool": <time first seen>}` instead of a block height.

    A transaction can leave the mempool without being confirmed: when a block
    confirms another transaction that spends the same coins, or, on BTC, when a
    replacement that pays a higher fee arrives (replace-by-fee). It is then
    removed from every balance and history, together with any transaction that
    spends its outputs. It can still be fetched by its id, with
    `"deleted": true`, so a wallet that showed a payment can tell its user what
    became of it instead of the payment silently disappearing.

    ## Reorganisations

    When the network switches to a chain with more work, the server undoes the
    blocks that are no longer in it, puts their transactions back in the
    mempool, and applies the new blocks. Every answer reflects the chain with
    the most work at the time of the request. Blocks of an abandoned chain keep
    answering by hash, with `"mainchain": false`.

    ## What the server trusts

    The server follows the chain with the most proof of work, as the network
    reports it, and checks what it needs to keep its indices consistent: that
    inputs exist and are not spent twice. It does not validate scripts or every
    consensus rule, as a full node does. Its answers are what the network says;
    for payments where a mistake would be costly, wait for confirmations, as with
    any wallet.

    ## Extended public keys

    Most wallets are an extended public key (xpub) from which they derive their
    addresses. The `/xpub` endpoints answer for all of them at once: the server
    derives the receiving chain (`0`) and the change chain (`1`), and looks at
    every address up to the last used one of each chain and then a gap of unused
    addresses after it (32, unless the operator changed it), and always at least
    the first 20 addresses. A payment to an address further away is not seen,
    as a wallet that follows BIP 44 with the same gap would not see it either.

    The `derive` parameter says which kind of address the wallet derives. An
    xpub does not say it, and the same key gives different addresses for each
    kind, so asking for the wrong kind would find nothing, and a wallet would
    show its user a zero balance. Instead, when a wallet has no transactions
    with the kind asked for but has some with another kind, the server answers
    400 with a message that names the right one. A wallet with no transactions
    of any kind is new, and gets an empty answer. The check only runs for
    wallets that look empty, so it costs nothing for wallets in use.

    Servers with a Redis cache keep large wallets ready: their first query reads
    the database and caches the result, and later ones are answered from memory.
    A cached answer is always the same as the database's; `nocache=true` skips
    the cache.

    ## Live updates

    Instead of polling, keep `/events` open: it sends a line for every new block
    and every change to the mempool, as a stream of JSON lines or over a
    WebSocket. Events carry only the hash; fetch what you need from it. A client
    that falls more than 10,000 events behind is disconnected, so that one slow
    client cannot make the server hold an ever-growing queue for it.

    ## Blockchain.info compatibility

    The endpoints under `/blockchain/` answer like those of Blockchain.info, with
    the same parameters, field names and conventions, so that software written
    for it can switch by changing its base URL. They are documented here where
    they differ or where the original is unclear. An operator may turn them off.

    ## Browsers

    Every response has the header `Access-Control-Allow-Origin: *`, so web
    applications can call the API directly from a browser. The API needs no
    credentials and keeps no sessions, so there is nothing for another site to
    abuse.

tags:
  - name: Address
    description: |
      Balances, transactions and unspent outputs of addresses, one at a time or
      many at once, and of extended public keys (xpubs), which stand for every
      address of a wallet.
  - name: Transaction
    description: |
      Transactions by id, the transactions of a block, the mempool, and
      broadcasting new transactions to the network.
  - name: Block
    description: |
      Blocks by hash, height or time, the newest blocks, and their serialized
      form.
  - name: Network
    description: |
      The state of the server and the network: health, peers, and a live stream of
      new blocks and transactions.
  - name: Blockchain
    description: |
      Endpoints that answer like those of Blockchain.info, for software written
      for it. An operator may turn them off, in which case they answer 404.

paths:
  '/health':
    get:
      tags:
        - Network
      summary: Health Check
      description: |
        Whether this server is ready to answer, for load balancers and monitoring.

        The status is **200** when every check passes and **503** when one fails;
        the body is the same either way and says which check failed. A server that is
        still catching up with the network answers 503, so a load balancer stops
        sending it traffic until its answers are current.

        The checks are run in the background every 30 seconds (unless the operator
        changed it), and this endpoint returns the latest result. It does no work of
        its own, so it is safe to call as often as a load balancer likes.
      operationId: healthCheck
      parameters:
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
              example:
                ok: true
                net: bch
                blocks:
                  ok: true
                  max: 2
                  blocks: 688794
                  diff: 0
                  headers: 688794
                pending-txs:
                  ok: true
                  max: 100
                  count: 0
                version: *version
                last-tx:
                  ok: true
                  max: 300
                  age: 0
                last-block:
                  ok: true
                  max: 7200
                  age: 3279
                peers:
                  ok: true
                  count: 20
                  min: 1
                time: '2021-06-14 10:21:43 UTC'
            application/octet-stream:
              schema:
                type: string
                format: binary
        '503':
          description: unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
              example:
                ok: false
                net: bch
                blocks:
                  ok: false
                  max: 2
                  blocks: 688794
                  diff: 4
                  headers: 688798
                pending-txs:
                  ok: true
                  max: 100
                  count: 0
                version: *version
                last-tx:
                  ok: true
                  max: 300
                  age: 0
                last-block:
                  ok: true
                  max: 7200
                  age: 3279
                peers:
                  ok: false
                  count: 0
                  min: 1
                time: '2021-06-14 10:21:43 UTC'

  '/address/{address}/transactions':
    get:
      tags:
        - Address
      summary: Transactions for Address
      description: |
        The transactions that pay to or spend from an address, newest first, as
        transaction ids with their place in the chain.

        This is the light way to follow an address: fetch the transactions you do not
        have yet with `/transactions`. Use `/transactions/full` to get them in one
        call when you need them all. See *Paging* at the top for `limit`, `offset`
        and `height`.

        An address with no transactions gives an empty list. An address that does
        not parse for this network gives 404.
      operationId: getAddressTxs
      parameters:
        - $ref: '#/components/parameters/addressParam'
        - $ref: '#/components/parameters/heightParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: Transaction list starting with most recent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TxRef'
              example:
                - txid: 00f304a6089a708168cd10d5ad8abd2977c36791156a55b040117cb5a3db7fad
                  block:
                    height: 688793
                    position: 3
                - txid: b810589c80335083ed715c03abf62f23968846d2f54343bac305f890f292ec8e
                  block:
                    height: 688707
                    position: 786
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

