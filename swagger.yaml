  '/address/{address}/balance':
    get:
      tags:
        - Address
      operationId: getBalance
      summary: Address Balance
      description: |
        The balance of an address: confirmed and unconfirmed amounts, the number of
        unspent outputs and of transactions, and the total ever received.

        An address that has never been used has a balance of zero rather than giving
        404: every valid address exists, it just has not received anything yet.
      parameters:
        - $ref: '#/components/parameters/addressParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: Address balance and other stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
              example:
                address: bitcoincash:qqmaqu9nceck5ct5pqrjy4ulhhw66wdlkv2s7f2l9u
                confirmed: 0
                unconfirmed: 0
                utxo: 0
                txs: 2
                received: 2275183814
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  '/address/balances':
    get:
      tags:
        - Address
      summary: Multiple Address Balances
      description: |
        The balances of several addresses, in one call. Every address in the request
        has a balance in the response, unused ones with zeros.
      operationId: getMultipleAddressBalances
      parameters:
        - $ref: '#/components/parameters/addressesParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: Address balances and other stats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
              example:
                - address: bitcoincash:qqmaqu9nceck5ct5pqrjy4ulhhw66wdlkv2s7f2l9u
                  confirmed: 0
                  unconfirmed: 0
                  utxo: 0
                  txs: 2
                  received: 2275183814
                - address: bitcoincash:qql2wpu4fa36yf07gcc8q80sjfxfaq66xssezyukg2
                  confirmed: 0
                  unconfirmed: 0
                  utxo: 0
                  txs: 2
                  received: 2259981628
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid Address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  '/address/{address}/unspent':
    get:
      tags:
        - Address
      summary: Address Unspent Outputs
      description: |
        The outputs paid to an address that are not spent yet, newest first: the
        coins a wallet can spend.

        Outputs spent by an unconfirmed transaction are left out, because spending
        them again would conflict with it. Unconfirmed outputs are included, with
        `"block": {"mempool": …}`; whether to spend them is the wallet's choice.
      operationId: getAddressUnspent
      parameters:
        - $ref: '#/components/parameters/addressParam'
        - $ref: '#/components/parameters/heightParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/prettyParam'
