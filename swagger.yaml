    get:
      tags:
        - Address
      operationId: getXPubBalances
      summary: Extended Public Key Balances
      description: |
        The balance of every address of a wallet that the server looked at, with its
        derivation path: each used address, and the unused ones of the gap, with
        zeros, so a wallet can see which addresses it may still hand out. For the
        total, use `/xpub/{xpub}`.
      parameters:
        - $ref: '#/components/parameters/xpubParam'
        - $ref: '#/components/parameters/xpubDerive'
        - $ref: '#/components/parameters/nocacheParam'
        - $ref: '#/components/parameters/prettyParam'
      responses:
        '200':
          description: Balances only for used addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/XPubBalance'
              example:
                - path:
                    - 0
                    - 0
                  balance:
                    address: bitcoincash:qpyq63tvlk0pca8mah6a8c0zxrvq8qvjzymrrnwprn
                    confirmed: 0
                    unconfirmed: 0
                    utxo: 0
                    txs: 8
