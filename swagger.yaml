  '/blockchain/multiaddr':
    get:
      tags:
        - Blockchain
      operationId: getBinfoMultiAddr
      summary: Wallet Data
      description: |
        The balances and transactions of a wallet made of addresses and xpubs, as
        Blockchain.info answers, with the current price of the coin in a currency
        of your choice.

        Transactions show the change to the balance of the wallet as a whole, and,
        by default, incoming transactions leave out outputs to other addresses
        (`noCompact` keeps them): a payment from an exchange can have hundreds of
        outputs to other people, which the wallet has no use for.
      parameters:
        - $ref: '#/components/parameters/binfoActive'
        - $ref: '#/components/parameters/binfoActiveP2SH'
        - $ref: '#/components/parameters/binfoActiveBech32'
