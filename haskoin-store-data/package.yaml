name: haskoin-store-data
version: 1.8.1
synopsis: Data types and API client of Haskoin Store
description: |
  The types of the data that Haskoin Store serves (blocks, transactions,
  balances, unspent outputs, extended public keys, health checks, events and
  the Blockchain.info compatible formats), with their JSON and binary
  encodings, and a client for its REST API. Use it to talk to a Haskoin Store
  server from Haskell.
category: Bitcoin, Finance, Network
author: JP Rupp
maintainer: jprupp@protonmail.ch
copyright: (c) Haskoin Developers
license: MIT
license-file: LICENSE
github: jprupp/haskoin-store/haskoin-store-data
homepage: https://github.com/jprupp/haskoin-store#readme
bug-reports: https://github.com/jprupp/haskoin-store/issues
tested-with: GHC == 9.12.4
extra-doc-files:
  - README.md
  - CHANGELOG.md
language: GHC2024
# used by every module: records with fields of the same name, read with a dot
default-extensions:
  - DuplicateRecordFields
  - NoFieldSelectors
  - OverloadedRecordDot
  - OverloadedStrings
ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  # The records of the API have fields named like Prelude functions (sequence,
  # max, hash, ...), which record wildcards bind, and sum types with fields
  # (BlockRef, ...); changing either would break the programs that use them.
  - -Wno-name-shadowing
  - -Wno-partial-fields
dependencies:
  - aeson ^>= 2.2.5.1
  - base ^>= 4.21.2.0
  - binary ^>= 0.8.9.3
  - bytes ^>= 0.17.5
  - bytestring ^>= 0.12.2.0
  - cereal ^>= 0.5.8.3
  - containers ^>= 0.7
  - deepseq ^>= 1.5.1.0
  - hashable ^>= 1.5.1.0
  - haskoin-core ^>= 1.6.1
  - network ^>= 3.2.12.0
  - scotty ^>= 0.30
  - string-conversions ^>= 0.4.0.1
  - text ^>= 2.1.4
  - time ^>= 1.14
  - unordered-containers ^>= 0.2.21
  - wreq ^>= 0.5.4.5
  - http-types ^>= 0.12.6
  - lens ^>= 5.3.6
  - mtl ^>= 2.3.2
  - data-default ^>= 0.8.0.2
  - http-client ^>= 0.7.19
  - vector ^>= 0.13.2.0
library:
  source-dirs: src
  exposed-modules:
    - Haskoin.Store.Data
    - Haskoin.Store.WebClient
    - Haskoin.Store.WebCommon
tests:
  spec:
    main: Spec.hs
    source-dirs: test
    verbatim:
      build-tool-depends:
        hspec-discover:hspec-discover
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - haskoin-store-data
      - hspec ^>= 2.11.18
      - QuickCheck ^>= 2.17.1.0
